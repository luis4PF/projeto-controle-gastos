<h1 class="page-title">Usuários da conta</h1>
<p class="lead">
  Cadastre cada pessoa com nome, e-mail e senha. Em métodos de pagamento, o responsável deve ser um
  destes usuários — assim fica vinculado ao <code>user id</code> correto no sistema.
</p>

<div class="toolbar">
  <button mat-flat-button color="primary" type="button" (click)="openCreate()">
    <mat-icon>person_add</mat-icon>
    Novo usuário
  </button>
</div>

@if (loading()) {
  <div class="loading">
    <mat-spinner diameter="40" />
  </div>
} @else {
  <mat-card appearance="outlined">
    <table mat-table [dataSource]="rows()" class="full-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>E-mail</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          @if (isSelf(row)) {
            <span class="badge">Você</span>
          } @else {
            <button
              mat-icon-button
              type="button"
              (click)="confirmDelete(row)"
              aria-label="Excluir usuário"
            >
              <mat-icon>delete</mat-icon>
            </button>
          }
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </mat-card>
}
